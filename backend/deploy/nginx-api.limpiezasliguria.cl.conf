# ---------------------------------------
# BLOQUE: BACKEND (NestJS) para limpiezasliguria.cl
# Sirve la API en api.limpiezasliguria.cl -> puerto 3003
#
# IMPORTANTE: 3000 y 3001 ya están tomados por voz-en-letras en este
# servidor, por eso este backend usa el puerto 3003 (ver backend/.env.example).
#
# Cómo usarlo:
# 1. Crea el registro DNS: A  api.limpiezasliguria.cl  -> IP del servidor.
# 2. Pega este bloque dentro de /etc/nginx/sites-enabled/limpiezasliguria
#    (junto a los bloques que ya existen para limpiezasliguria.cl).
# 3. nginx -t && systemctl reload nginx
# 4. certbot --nginx -d api.limpiezasliguria.cl
#    Certbot reescribe este bloque solo: agrega "listen 443 ssl", las líneas
#    ssl_certificate/ssl_certificate_key, y crea el bloque de redirección
#    80->443, igual que ya hizo con vozenletras.cl y limpiezasliguria.cl.
# ---------------------------------------
server {
    server_name api.limpiezasliguria.cl;

    client_max_body_size 5M;

    access_log /var/log/nginx/limpiezasliguria_api_access.log;
    error_log /var/log/nginx/limpiezasliguria_api_error.log;

    location /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    location / {
        # Redirige al puerto 3003 donde corre este backend NestJS
        proxy_pass http://localhost:3003;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    listen 80;
}
